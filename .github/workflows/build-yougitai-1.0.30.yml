name: Build YougitAI 1.0.30 ZIP

on:
  push:
    branches:
      - chatgpt/button-style-isolation-1.0.30

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable plugin ZIP
        run: |
          zip -r yougitai-secure-showcase-1.0.30.zip yougitai-secure-showcase -x "*.git*" ".github/*"
      - uses: actions/upload-artifact@v4
        with:
          name: yougitai-secure-showcase-1.0.30
          path: yougitai-secure-showcase-1.0.30.zip
          if-no-files-found: error
