name: Build YougitAI 1.0.28 ZIP

on:
  push:
    branches:
      - chatgpt/elementor-kit-background-1.0.28

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable plugin ZIP
        run: |
          zip -r yougitai-secure-showcase-1.0.28.zip yougitai-secure-showcase -x "*.git*" ".github/*"
      - uses: actions/upload-artifact@v4
        with:
          name: yougitai-secure-showcase-1.0.28
          path: yougitai-secure-showcase-1.0.28.zip
          if-no-files-found: error
